name: E2E test

on:
  push:
    branches:
      - main
    tags-ignore:
      - v*
  pull_request:

permissions:
  contents: read

env:
  # incremental builds are slower and don't make much sense in ci
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: FULL
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: E2E-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      # `forge install` is redundant here: actions/checkout already fetches the
      # contracts submodule recursively, so lib/ is populated at the pinned
      # gitlinks. It also fails since forge 1.8.0, which turned the mismatch
      # between contracts/foundry.lock and those gitlinks into a hard error and
      # tries to `git checkout` a tag the shallow submodule clone doesn't have.
      - run: cd contracts && forge build
      - run: |
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          echo "${HOME}/.bb" >> $GITHUB_PATH
          ${HOME}/.bb/bbup -v 5.0.0
      # - uses: Swatinem/rust-cache@v2
      - name: E2E-Test
        run: bash local-setup.sh test
